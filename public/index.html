<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4Geeks Marketing Hub</title>
<script>
  // Apply theme before first paint so dark mode never flashes white.
  (function(){ try{ var t=localStorage.getItem('dashTheme')||'system'; if(t!=='system') document.documentElement.setAttribute('data-theme', t); }catch(e){} })();
</script>
<link rel="icon" type="image/png" href="/brand/4geeks-head-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/hub.css">
<link rel="stylesheet" href="/brand.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
</head>
<body>

<div id="login-screen" class="login-screen" hidden>
  <div class="login-box">
    <div class="login-top"><span class="logo-swap login-logo"><img src="/brand/4geeks-logo-dark.png" alt="4Geeks" class="on-light"><img src="/brand/4geeks-logo-white.png" alt="4Geeks" class="on-dark"></span><span class="ybadge">Marketing Hub</span></div>
    <h1 data-i18n="appName">Leads & Deals</h1>
    <p class="login-subtitle" data-i18n="signInSub"></p>
    <form id="login-form">
      <label for="username" data-i18n="username"></label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
      <label for="password" data-i18n="password"></label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <button type="submit" class="btn primary block" data-i18n="signIn"></button>
      <div id="login-error" class="login-error" hidden></div>
    </form>
    <div class="login-foot"><button class="lang-mini" data-setlang="en">EN</button><button class="lang-mini" data-setlang="es">ES</button></div>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <span class="logo-swap sb-logo"><img src="/brand/4geeks-logo-dark.png" alt="4Geeks" class="on-light full"><img src="/brand/4geeks-logo-white.png" alt="4Geeks" class="on-dark full"><img src="/brand/4geeks-head-dark.png" alt="4Geeks" class="on-light head"><img src="/brand/4geeks-head-white.png" alt="4Geeks" class="on-dark head"></span>
      <div class="sb-brand-text"><div class="sb-title" data-i18n="appName"></div><div class="sb-sub" data-i18n="appSub"></div></div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-footer">
      <button class="sb-item sb-settings" id="btn-settings" data-view="settings"><span class="ico" data-icon="settings"></span><span class="sb-text" data-i18n="nav_settings"></span></button>
      <button class="sb-item sb-logout" id="btn-logout"><span class="ico" data-icon="logout"></span><span class="sb-text" data-i18n="logout"></span></button>
      <button class="sb-item sb-collapse" id="btn-collapse"><span class="ico" data-icon="collapse"></span><span class="sb-text" data-i18n="collapse"></span></button>
    </div>
  </aside>
  <div class="sb-scrim" id="sb-scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" aria-label="Menu"><span class="ico" data-icon="menu"></span></button>
      <div class="tb-titles">
        <div class="tb-eyebrow" id="page-eyebrow"></div>
        <h1 id="page-title"></h1>
        <p id="page-sub" class="tb-sub"></p>
      </div>
      <div class="tb-actions">
        <span id="freshness" class="freshness"></span>
        <button class="btn ghost sm" id="btn-refresh"><span class="ico" data-icon="refresh"></span><span data-i18n="refresh"></span></button>
        <button class="btn ghost sm" id="btn-copy-link"><span class="ico" data-icon="link"></span><span class="hide-sm" data-i18n="copyLink"></span></button>
      </div>
    </header>

    <section class="filterbar" id="filterbar"></section>
    <div class="chips" id="active-chips"></div>

    <div class="views">
      <div id="tab-overview" class="view"></div>
      <div id="tab-enrollments" class="view"></div>
      <div id="tab-recommendations" class="view"></div>
      <div id="tab-compare" class="view"></div>
      <div id="tab-individual" class="view"></div>
      <div id="tab-ads" class="view"></div>
      <div id="tab-adsync" class="view"></div>
      <div id="tab-ai" class="view"></div>
      <div id="tab-press" class="view"></div>
      <div id="tab-events" class="view"></div>
      <div id="tab-social" class="view"></div>
      <div id="tab-proposals" class="view"></div>
      <div id="tab-settings" class="view"></div>
    </div>
  </main>
</div>

<div class="drawer-scrim" id="drawer-scrim"></div>
<aside class="drawer" id="filter-drawer" aria-hidden="true"></aside>
<aside class="drawer drawer-lg" id="lead-drawer" aria-hidden="true"></aside>
<aside class="drawer drawer-lg" id="hub-drawer" aria-hidden="true"></aside>
<div id="popover-root"></div>

<script src="/i18n.js"></script>
<script src="/proposals.js"></script>
<script src="/compare.js"></script>
<script src="/enrollments.js"></script>
<script src="/hub-common.js"></script>
<script src="/hub-events.js"></script>
<script src="/hub-social.js"></script>
<script src="/pipeline.js"></script>
<script src="/marketing-intel.js"></script>
<script src="/attribution.js"></script>
<script src="/settings.js"></script>
<script src="/dashboard.js"></script>
</body>
</html>
